name: Feature Request
description: Suggest an idea for Obelisk CLI
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe the problem you're trying to solve, not just the solution you want.

  - type: checkboxes
    id: verified
    attributes:
      label: Feature hasn't been suggested before
      options:
        - label: I have verified this feature hasn't been suggested before
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: A clear description of the problem or need
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like to see implemented?
      placeholder: Describe the feature, command, or behavior
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: What alternatives have you considered?
      placeholder: Workarounds, other tools, etc.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Use Case
      description: How would this feature be used? Who would benefit?
      placeholder: "This would help when..."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: What part of the project does this affect?
      options:
        - CLI Commands
        - Memory (Nexus)
        - Search (Zoekt)
        - Semantic (Serena)
        - Structural (ast-grep)
        - Token/Policy (Obelisk Core)
        - Documentation
        - Configuration
        - Plugin System
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or references
    validations:
      required: false