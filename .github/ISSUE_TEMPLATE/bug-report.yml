name: Bug Report
description: Report a bug to help us improve Obelisk CLI
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.

        > **Note:** AI-generated reports will be closed without review. Please only submit genuine bug reports.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run 'obelisk run "..."'
        2. See error...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of Obelisk CLI are you running?
      placeholder: e.g., 0.1.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS are you using?
      placeholder: e.g., macOS 14.5, Ubuntu 24.04, Windows 11
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Runtime Version
      description: What Node.js/Bun version?
      placeholder: e.g., Bun 1.3.14, Node 22.4
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Critical (application crash, data loss)
        - Major (feature broken, no workaround)
        - Minor (feature broken, has workaround)
        - Trivial (cosmetic, documentation)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and Screenshots
      description: If applicable, add error logs, stack traces, or screenshots
      placeholder: Paste logs or screenshots here
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Paste your obelisk.config.jsonc (with secrets redacted)
      placeholder: |
        {
          "nexus": { ... },
          "obelisk": { ... }
        }
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem
    validations:
      required: false